    <text x="745" y="625" fill="#ffffff">Gorduras</text>
  </g>
  <text x="90" y="830" fill="#ffffff" font-family="Arial, sans-serif" font-size="38">FitFood · Diário alimentar para quem treina</text>
  <text x="90" y="930" fill="#c5d8cb" font-family="Arial, sans-serif" font-size="28">Valores informados pelo usuário. Sem prescrição de dieta.</text>
</svg>
