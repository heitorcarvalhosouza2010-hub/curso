name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Create beta release and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FitFood-Android-v0.2.0.apk
          if ! gh release view v0.2.0 --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create v0.2.0 \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "FitFood v0.2.0 (beta)" \
              --notes "Versão Android com login local, escolha de objetivo, análise de foto por IA e diário por conta."
          fi
          gh release upload v0.2.0 FitFood-Android-v0.2.0.apk \
            --repo "${GITHUB_REPOSITORY}" --clobber
